name: Build disc and deploy the try-it site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the ELF and the CDI in the KallistiOS image
        run: |
          docker run --rm -v "$PWD":/src -w /src einsteinx2/dcdev-kos-toolchain:latest sh -c "make cdi"
          mkdir -p site/game
          cp build/herder.cdi site/game/herder.cdi
          cp herder.elf site/game/herder.elf
          ls -la site/game
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/upload-artifact@v4
        with:
          name: herder-dreamcast
          path: |
            build/herder.cdi
            herder.elf
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
