name: Build disc and deploy the try-it site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the ELF and the browser ISO in the KallistiOS image
        run: docker run --rm -v "$PWD":/src -w /src einsteinx2/dcdev-kos-toolchain:latest sh -c "make iso"
      - name: Build the self-booting CDI with mkdcdisc
        run: |
          docker build -t herder-mkdcdisc -f tools/Dockerfile.mkdcdisc tools
          docker run --rm -v "$PWD":/src -w /src herder-mkdcdisc mkdcdisc -e herder.elf -o build/herder.cdi -n "Curse of the Herder" -a "Hunter Davis" -r 20260907 -N
      - name: Stage the game files into the site
        run: |
          mkdir -p site/game
          cp build/herder.cdi site/game/herder.cdi
          cp build/herder-plain.iso site/game/herder-plain.iso
          cp herder.elf site/game/herder.elf
          ls -la site/game
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/upload-artifact@v4
        with:
          name: herder-dreamcast
          path: |
            build/herder.cdi
            herder.elf
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
